# Se copia en la VM a /etc/nginx/snippets/tramites-http-nv.conf (lo usa el bloque «listen 80» de
# deploy/nginx/tramites). TEMPORAL mientras no haya certificado: sitio público de Negocios Verdes por http.
proxy_pass http://127.0.0.1:3000;
proxy_redirect http://localhost:3000/ /;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto http;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
