# Redirección del dominio anterior de Negocios Verdes al módulo del SIC.
# NO ESTÁ ACTIVA: se instala cuando TI publique sic.cdmb.gov.co con certificado y el dominio anterior
# apunte a este servidor (ver docs/NEGOCIOS-VERDES.md, «Dominio anterior»). Reemplazar
# DOMINIO_ANTERIOR por el nombre real y poner su certificado.
#
# Las rutas de la plataforma anterior se conservan con el prefijo /negocios-verdes:
#   /                      -> /negocios-verdes
#   /negocio/<slug>        -> /negocios-verdes/negocio/<slug>
#   /buscar?…              -> /negocios-verdes/buscar?…  (lleva al buscador con el mismo filtro)
#   /geovisor, /geovisor/embed, /nosotros, /plan-nacional, /contacto -> igual con el prefijo
#   /admin…                -> /negocios-verdes (el panel no se publica en internet)
server {
    listen 443 ssl;
    server_name DOMINIO_ANTERIOR;
    # ssl_certificate     /etc/ssl/...;
    # ssl_certificate_key /etc/ssl/...;

    location ^~ /admin { return 301 https://sic.cdmb.gov.co/negocios-verdes; }
    location = /       { return 301 https://sic.cdmb.gov.co/negocios-verdes; }
    location /         { return 301 https://sic.cdmb.gov.co/negocios-verdes$request_uri; }
}

server {
    listen 80;
    server_name DOMINIO_ANTERIOR;
    return 301 https://DOMINIO_ANTERIOR$request_uri;
}
